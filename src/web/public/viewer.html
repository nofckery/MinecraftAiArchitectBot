<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Bot 3D Live Cam — Multi-Monitor View</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Standalone Popout Window CAD Styling */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #050811;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
    }

    .popout-header-bar {
      height: 44px;
      background: rgba(13, 20, 32, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-bright, #334155);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    .popout-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .popout-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--accent-cyan, #00e5ff);
      font-family: var(--font-mono, monospace);
    }

    .popout-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .popout-viewport-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      height: calc(100vh - 44px);
      background-color: #000;
      overflow: hidden;
    }

    .popout-viewport-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Fullscreen state on popout viewport */
    .popout-viewport-wrapper:fullscreen,
    .popout-viewport-wrapper:-webkit-full-screen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 99999;
    }
  </style>
</head>
<body>
  <header class="popout-header-bar" id="popoutHeaderBar">
    <div class="popout-brand">
      <span class="live-tag">● LIVE CAM</span>
      <span class="popout-title" id="popoutTitle">MINECRAFT BOT 3D LIVE CAM — MULTI-MONITOR VIEW</span>
    </div>
    <div class="popout-actions">
      <button id="btnPopoutReload" class="btn-micro" title="Viewer-Stream neu laden" type="button">↺ Neu laden</button>
      <button id="btnPopoutFullscreen" class="btn-micro" title="Vollbildmodus aktivieren (Esc)" type="button">⛶ Vollbild</button>
      <button id="btnPopoutReembed" class="btn btn-primary btn-sm" title="Kamera zurück in das Haupt-Cockpit verschieben und Fenster schließen" type="button">⤺ Im Cockpit wiedereinbetten</button>
    </div>
  </header>

  <main class="popout-viewport-wrapper" id="popoutWrapper">
    <iframe id="popoutFrame" src="about:blank" title="Prismarine Viewer Multi-Monitor Stream" allow="fullscreen; pointer-lock" allowfullscreen></iframe>
  </main>

  <script src="js/popoutViewer.js" type="module"></script>
</body>
</html>
